# OMOTE remote control.
#
# This file is the entry point: it names the device, connects it to the network,
# and pulls in the framework. Edit the files under user/ to change what the
# remote does; the files under core/ describe the hardware and can be replaced
# wholesale when the framework is updated.

substitutions:
  device_name: omote
  friendly_name: OMOTE

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  # Framework. Replace these when updating; do not edit.
  hardware: !include core/hardware.yaml
  ir: !include core/ir.yaml
  ui: !include core/ui.yaml
  # Yours.
  activities: !include user/activities.yaml
  keymap: !include user/keymap.yaml

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret hotspot_password

web_server:
  port: 80

button:
  - platform: restart
    name: "Restart"
