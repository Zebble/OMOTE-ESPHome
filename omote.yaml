esphome:
  name: omote-test
  friendly_name: omote-test
  on_boot:
    # Required to set lcd_rd off before display will work
    - priority: 600
      then:
        - output.turn_off: lcd_rd

external_components:
  # csaboka21's TCA8418 keypad component - drains the full event FIFO on each
  # interrupt (fixes the intermittent/dropped key presses seen with the older
  # evil-dog fork) and adds press/release, debounce and long-press handling.
  - source: github://csaboka21/esphome-TCA8418@main
    components: [tca8418_keypad]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Omote-Test Fallback Hotspot"
    password: !secret hotspot_password

web_server:
  port: 80

psram:

i2c:
  sda: GPIO20
  scl: GPIO19
  # Pullups are provided by hardware
  sda_pullup_enabled: False
  scl_pullup_enabled: False
  scan: true

# TCA8418 keypad controller. rows/columns must cover the highest key in use:
# the Power button is keycode 51 = row 5, so 6 rows are scanned; columns top out
# at index 4 (keycode 5), so 5 columns. Bump these if you map keys with higher codes.
tca8418_keypad:
  id: keypad
  address: 0x34
  interrupt_pin: GPIO08
  rows: 6
  columns: 5

output:
  # LCD Backlight GPIO
  - platform: ledc
    id: gpio_09
    pin:
      number: GPIO09
      inverted: true
  # Keypad Backlight GPIO
  - platform: ledc
    id: gpio_46
    pin:
      number: GPIO46
      inverted: False
  - platform: gpio
    # lcd_rd pin needs to be set HIGH before LCD will work.
    # Set HIGH (turn off) with boot priority in esphome section.
    id: lcd_rd
    pin:
      number: GPIO42
      inverted: True

light:
  - platform: monochromatic
    output: gpio_09
    restore_mode: RESTORE_DEFAULT_OFF
    name: "LCD Backlight"
  - platform: monochromatic
    output: gpio_46
    restore_mode: RESTORE_DEFAULT_OFF
    name: "Keypad Backlight"

button:
  - platform: restart
    name: "Restart"

touchscreen:
  - platform: ft63x6
    transform:
      mirror_x: True
      mirror_y: True

binary_sensor:
  - platform: gpio
    name: "Battery Charging"
    pin:
      number: GPIO01
      inverted: True
      mode:
        input: True
        pullup: True
    filters:
      - delayed_off: 1s

  # Physical Keypad
  - platform: tca8418_keypad
    keypad_id: keypad
    id: s17
    keycode: 51
    name: "Power"
  - platform: tca8418_keypad
    keypad_id: keypad
    id: s25
    keycode: 5
    name: "Stop"
  - platform: tca8418_keypad
    keypad_id: keypad
    id: s24
    keycode: 4
    name: "Rewind"
  - platform: tca8418_keypad
    keypad_id: keypad
    id: s22
    keycode: 2
    name: "Play"
  - platform: tca8418_keypad
    keypad_id: keypad
    id: s16
    keycode: 11
    name: "Fast Forward"

spi:
  - id: quad_spi_bus
    type: octal
    clk_pin:
      number: GPIO41
    data_pins:
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO14
      - GPIO13
      - GPIO12
      - GPIO11
      - GPIO10

display:
  - platform: mipi_spi
    model: ILI9341
    bus_mode: octal
    dc_pin: GPIO40
    cs_pin: GPIO39
    enable_pin:
      number: GPIO38
      inverted: true
    auto_clear_enabled: false
    update_interval: never
    data_rate: 40MHz

lvgl:
  pages:
    - id: keypad_page
      widgets:
        - buttonmatrix:
            id: lvgl_keypad
            x: 0
            y: 0
            width: 240
            height: 320
            items:
              pressed:
                bg_color: 0xFFFF00
            rows:
              - buttons:
                  - text: 1
                    control:
                      no_repeat: true
                  - text: 2
                    control:
                      no_repeat: true
                  - text: 3
                    control:
                      no_repeat: true
              - buttons:
                  - text: 4
                    control:
                      no_repeat: true
                  - text: 5
                    control:
                      no_repeat: true
                  - text: 6
                    control:
                      no_repeat: true
              - buttons:
                  - text: 7
                    control:
                      no_repeat: true
                  - text: 8
                    control:
                      no_repeat: true
                  - text: 9
                    control:
                      no_repeat: true
              - buttons:
                  - text: "\uF55A"
                    key_code: "*"
                    control:
                      no_repeat: true
                  - text: 0
                    control:
                      no_repeat: true
                  - text: "\uF00C"
                    key_code: "#"
                    control:
                      no_repeat: true
            on_press: # Triggers for the matrix, to determine which button was pressed.
              then:
                - logger.log:
                    format: "Matrix button pressed: %d"
                    args: ["x"]  # If x is 65535, it was the container, (or through a disabled button).
                - lambda: |-
                    // Handle each button
                    switch (x) {
                      case 0:
                        break;
                      case 1:
                        break;
                      case 2:
                        break;
                      default:
                        break;
                    }
                    ESP_LOGD("custom","Button pressed: %d",x);
                - remote_transmitter.transmit_nec:
                    address: 0x1234
                    command: 0x78AB
                    command_repeats: 1


switch:
  # IR Receiver power
  - platform: gpio
    name: "IR Receiver Power"
    pin:
      number: GPIO06
    restore_mode: ALWAYS_OFF

remote_receiver:
  pin:
    number: GPIO04
  dump: all
  use_dma: True

remote_transmitter:
  pin:
    number: GPIO05
    inverted: True
  carrier_duty_percent: 50%
  use_dma: True

