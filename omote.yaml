esphome:
  name: omote-test
  friendly_name: omote-test
  on_boot:
    # Power the peripheral rail (GPIO38, active-low) before the I2C bus scans, so
    # the LIS3DH and the boot-time bus scan see a live bus. The display drives
    # GPIO38 later during its own setup; enabling it early just avoids the
    # harmless "SCL held low" scan error at boot.
    - priority: 1010
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);  // LOW = enabled (display uses inverted: true)
            delay(250);
    # Required to set lcd_rd off before display will work
    - priority: 600
      then:
        - output.turn_off: lcd_rd

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Omote-Test Fallback Hotspot"
    password: !secret hotspot_password

web_server:
  port: 80

psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: GPIO20
  scl: GPIO19
  # Pullups are provided by hardware
  sda_pullup_enabled: False
  scl_pullup_enabled: False
  scan: true

# TCA8418 keypad controller. The OMOTE scans a 5x5 key matrix (ROW0-4 / COL0-4);
# the pins left over stay as individual inputs, which is how the Power button is
# wired (it reports as key number 102, ROW5).
tca8418:
  - id: keypad
    address: 0x34
    interrupt_pin: GPIO08
    rows: 5
    columns: 5

# LIS3DH accelerometer on the shared I2C bus (address 0x19). Built on the shared
# `motion` platform, so acceleration is exposed through `sensor: platform: motion`.
motion:
  - platform: lis3dh
    id: imu
    address: 0x19
    accelerometer_range: 2G
    accelerometer_odr: 50HZ          # enough for motion wake, low power
    operating_mode: LOW_POWER
    update_interval: 1s
    # Motion interrupt on INT1 (wired to GPIO2, active-low). Arms the wake source
    # for deep_sleep (see the commented block near the bottom). high_pass_filter
    # removes gravity so the small 0.2g threshold reacts to actual movement.
    interrupt:
      pin: INT1
      threshold: 0.2g
      active_high: false
      latched: false
      high_pass_filter: true

output:
  # LCD Backlight GPIO
  - platform: ledc
    id: gpio_09
    pin:
      number: GPIO09
      inverted: true
  # Keypad Backlight GPIO
  - platform: ledc
    id: gpio_46
    pin:
      number: GPIO46
      inverted: False
  - platform: gpio
    # lcd_rd pin needs to be set HIGH before LCD will work.
    # Set HIGH (turn off) with boot priority in esphome section.
    id: lcd_rd
    pin:
      number: GPIO42
      inverted: True

light:
  - platform: monochromatic
    output: gpio_09
    restore_mode: RESTORE_DEFAULT_OFF
    name: "LCD Backlight"
  - platform: monochromatic
    output: gpio_46
    restore_mode: RESTORE_DEFAULT_OFF
    name: "Keypad Backlight"

button:
  - platform: restart
    name: "Restart"

touchscreen:
  - platform: ft63x6
    transform:
      mirror_x: True
      mirror_y: True

sensor:
  # Battery fuel gauge. The board has a MAX17048 at 0x36, which ESPHome's
  # max17043 component reads correctly: same address and registers, and the
  # voltage scaling works out identical (1.25mV / 16 = 78.125uV).
  - platform: max17043
    update_interval: 60s
    battery_voltage:
      name: "Battery Voltage"
    battery_level:
      name: "Battery Level"
      # The gauge reads a little over 100% on a full battery.
      filters:
        - clamp:
            max_value: 100

  # LIS3DH temperature (relative / uncalibrated - add filters to calibrate).
  - platform: lis3dh
    type: temperature
    name: "LIS3DH Temperature"
  # Acceleration axes (unit: g) via the shared motion platform.
  - platform: motion
    type: acceleration_x
    name: "Accel X"
  - platform: motion
    type: acceleration_y
    name: "Accel Y"
  - platform: motion
    type: acceleration_z
    name: "Accel Z"
  - platform: motion
    type: pitch
    name: "Pitch"
  - platform: motion
    type: roll
    name: "Roll"

binary_sensor:
  - platform: gpio
    name: "Battery Charging"
    pin:
      number: GPIO01
      inverted: True
      mode:
        input: True
        pullup: True
    filters:
      - delayed_off: 1s

  # Physical Keypad. Matrix layout, by key number (row * 10 + col + 1);
  # key numbers 1 and 12 are unused positions.
  #
  #        COL0          COL1          COL2         COL3         COL4
  # ROW0   -             Play (2)      Conf (3)     Rewind (4)   Stop (5)
  # ROW1   FastFwd (11)  -             Back (13)    Up (14)      Left (15)
  # ROW2   Blue (21)     Chan- (22)    Red (23)     Yellow (24)  Green (25)
  # ROW3   Info (31)     Right (32)    Vol+ (33)    OK (34)      Down (35)
  # ROW4   SRC (41)      Chan+ (42)    Vol- (43)    Mute (44)    Record (45)
  #
  # Power is not part of the matrix: it is an individual input on ROW5.
  - platform: tca8418
    keypad_id: keypad
    key_code: 102
    name: "Power"
  - platform: tca8418
    keypad_id: keypad
    key_code: 2
    name: "Play"
  - platform: tca8418
    keypad_id: keypad
    key_code: 3
    name: "Conf"
  - platform: tca8418
    keypad_id: keypad
    key_code: 4
    name: "Rewind"
  - platform: tca8418
    keypad_id: keypad
    key_code: 5
    name: "Stop"
  - platform: tca8418
    keypad_id: keypad
    key_code: 11
    name: "Fast Forward"
  - platform: tca8418
    keypad_id: keypad
    key_code: 13
    name: "Back"
  - platform: tca8418
    keypad_id: keypad
    key_code: 14
    name: "Up"
  - platform: tca8418
    keypad_id: keypad
    key_code: 15
    name: "Left"
  - platform: tca8418
    keypad_id: keypad
    key_code: 21
    name: "Blue"
  - platform: tca8418
    keypad_id: keypad
    key_code: 22
    name: "Channel Down"
  - platform: tca8418
    keypad_id: keypad
    key_code: 23
    name: "Red"
  - platform: tca8418
    keypad_id: keypad
    key_code: 24
    name: "Yellow"
  - platform: tca8418
    keypad_id: keypad
    key_code: 25
    name: "Green"
  - platform: tca8418
    keypad_id: keypad
    key_code: 31
    name: "Info"
  - platform: tca8418
    keypad_id: keypad
    key_code: 32
    name: "Right"
  - platform: tca8418
    keypad_id: keypad
    key_code: 33
    name: "Volume Up"
  - platform: tca8418
    keypad_id: keypad
    key_code: 34
    name: "OK"
  - platform: tca8418
    keypad_id: keypad
    key_code: 35
    name: "Down"
  - platform: tca8418
    keypad_id: keypad
    key_code: 41
    name: "SRC"
  - platform: tca8418
    keypad_id: keypad
    key_code: 42
    name: "Channel Up"
  - platform: tca8418
    keypad_id: keypad
    key_code: 43
    name: "Volume Down"
  - platform: tca8418
    keypad_id: keypad
    key_code: 44
    name: "Mute"
  - platform: tca8418
    keypad_id: keypad
    key_code: 45
    name: "Record"

spi:
  - id: quad_spi_bus
    type: octal
    clk_pin:
      number: GPIO41
    data_pins:
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO14
      - GPIO13
      - GPIO12
      - GPIO11
      - GPIO10

display:
  - platform: mipi_spi
    model: ILI9341
    bus_mode: octal
    dc_pin: GPIO40
    cs_pin: GPIO39
    enable_pin:
      number: GPIO38
      inverted: true
    auto_clear_enabled: false
    update_interval: never
    data_rate: 40MHz

lvgl:
  pages:
    - id: keypad_page
      widgets:
        - buttonmatrix:
            id: lvgl_keypad
            x: 0
            y: 0
            width: 240
            height: 320
            items:
              pressed:
                bg_color: 0xFFFF00
            rows:
              - buttons:
                  - text: 1
                    control:
                      no_repeat: true
                  - text: 2
                    control:
                      no_repeat: true
                  - text: 3
                    control:
                      no_repeat: true
              - buttons:
                  - text: 4
                    control:
                      no_repeat: true
                  - text: 5
                    control:
                      no_repeat: true
                  - text: 6
                    control:
                      no_repeat: true
              - buttons:
                  - text: 7
                    control:
                      no_repeat: true
                  - text: 8
                    control:
                      no_repeat: true
                  - text: 9
                    control:
                      no_repeat: true
              - buttons:
                  - text: "\uF55A"
                    key_code: "*"
                    control:
                      no_repeat: true
                  - text: 0
                    control:
                      no_repeat: true
                  - text: "\uF00C"
                    key_code: "#"
                    control:
                      no_repeat: true
            on_press: # Triggers for the matrix, to determine which button was pressed.
              then:
                - logger.log:
                    format: "Matrix button pressed: %d"
                    args: ["x"]  # If x is 65535, it was the container, (or through a disabled button).
                - lambda: |-
                    // Handle each button
                    switch (x) {
                      case 0:
                        break;
                      case 1:
                        break;
                      case 2:
                        break;
                      default:
                        break;
                    }
                    ESP_LOGD("custom","Button pressed: %d",x);
                - remote_transmitter.transmit_nec:
                    address: 0x1234
                    command: 0x78AB
                    command_repeats: 1


switch:
  # IR Receiver power
  - platform: gpio
    name: "IR Receiver Power"
    pin:
      number: GPIO06
    restore_mode: ALWAYS_OFF

  # Uncomment together with the deep_sleep block below to keep the remote awake
  # (prevents sleep) for development / OTA updates.
  # - platform: template
  #   name: "Stay Awake"
  #   optimistic: true
  #   turn_on_action:
  #     - deep_sleep.prevent: deep_sleep_1
  #   turn_off_action:
  #     - deep_sleep.allow: deep_sleep_1

remote_receiver:
  pin:
    number: GPIO04
  dump: all
  use_dma: True

remote_transmitter:
  pin:
    number: GPIO05
    inverted: True
  carrier_duty_percent: 50%
  use_dma: True

# Deep-sleep motion wake (uncomment to enable, along with the "Stay Awake" switch
# above). The LIS3DH INT1 pad (GPIO2, active-low) wakes the device on movement;
# it stays awake run_duration after each wake. The accelerometer keeps sampling
# on its always-on rail while the ESP sleeps.
# deep_sleep:
#   id: deep_sleep_1
#   run_duration: 60s
#   wakeup_pin:
#     number: GPIO2
#     inverted: true          # INT is active-low: wake when it pulls GPIO2 LOW
#   wakeup_pin_mode: KEEP_AWAKE

