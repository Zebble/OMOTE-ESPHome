# Physical buttons.
#
# Every button is published to Home Assistant as a binary sensor, so the simplest
# way to give a button a job is a Home Assistant automation triggered by it -
# no rebuild needed, and it can do anything Home Assistant can.
#
# Handle a button here instead when it has to be fast, or has to keep working
# when the network is down. The Volume Up example below sends IR directly.
#
# Matrix layout, by key number (row * 10 + col + 1); 1 and 12 are unused:
#
#        COL0          COL1          COL2         COL3         COL4
# ROW0   -             Play (2)      Conf (3)     Rewind (4)   Stop (5)
# ROW1   FastFwd (11)  -             Back (13)    Up (14)      Left (15)
# ROW2   Blue (21)     Chan- (22)    Red (23)     Yellow (24)  Green (25)
# ROW3   Info (31)     Right (32)    Vol+ (33)    OK (34)      Down (35)
# ROW4   SRC (41)      Chan+ (42)    Vol- (43)    Mute (44)    Record (45)
#
# Power is not part of the matrix: it is an individual input on ROW5 (102).

binary_sensor:
  - platform: tca8418
    keypad_id: keypad
    key_code: 102
    name: "Power"
    on_press:
      # Power cycles between the last activity and Off.
      - lambda: |-
          bool is_off = id(activity).current_option() == "Off";
          id(activity).make_call().set_option(is_off ? "Watch TV" : "Off").perform();

  - platform: tca8418
    keypad_id: keypad
    key_code: 33
    name: "Volume Up"
    on_press:
      # Handled on the device so volume stays responsive and works offline.
      # Replace with the code your equipment uses (see core/ir.yaml for learning).
      - remote_transmitter.transmit_nec:
            address: 0x1234
            command: 0x78AB

  - platform: tca8418
    keypad_id: keypad
    key_code: 43
    name: "Volume Down"
  - platform: tca8418
    keypad_id: keypad
    key_code: 44
    name: "Mute"
  - platform: tca8418
    keypad_id: keypad
    key_code: 2
    name: "Play"
  - platform: tca8418
    keypad_id: keypad
    key_code: 5
    name: "Stop"
  - platform: tca8418
    keypad_id: keypad
    key_code: 4
    name: "Rewind"
  - platform: tca8418
    keypad_id: keypad
    key_code: 11
    name: "Fast Forward"
  - platform: tca8418
    keypad_id: keypad
    key_code: 42
    name: "Channel Up"
  - platform: tca8418
    keypad_id: keypad
    key_code: 22
    name: "Channel Down"
  - platform: tca8418
    keypad_id: keypad
    key_code: 14
    name: "Up"
  - platform: tca8418
    keypad_id: keypad
    key_code: 35
    name: "Down"
  - platform: tca8418
    keypad_id: keypad
    key_code: 15
    name: "Left"
  - platform: tca8418
    keypad_id: keypad
    key_code: 32
    name: "Right"
  - platform: tca8418
    keypad_id: keypad
    key_code: 34
    name: "OK"
  - platform: tca8418
    keypad_id: keypad
    key_code: 13
    name: "Back"
  - platform: tca8418
    keypad_id: keypad
    key_code: 31
    name: "Info"
  - platform: tca8418
