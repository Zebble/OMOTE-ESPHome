# Physical buttons.
#
# Every button is published to Home Assistant as a binary sensor, so the simplest
# way to give a button a job is a Home Assistant automation triggered by it -
# no rebuild needed, and it can do anything Home Assistant can.
#
# Most buttons say what they do rather than which device they are for, and
# send_command in activities.yaml works out where it should go - so volume can
# reach the amplifier while the transport keys reach whatever is playing.
#
# A button that has to be fast, or keep working when the network is down, can
# skip that and send infrared straight from the device instead:
#
#     on_press:
#       - remote_transmitter.transmit_nec:
#           address: 0x1234
#           command: 0x78AB
#
# Matrix layout, by key number (row * 10 + col + 1); 1 and 12 are unused:
#
#        COL0          COL1          COL2         COL3         COL4
# ROW0   -             Play (2)      Conf (3)     Rewind (4)   Stop (5)
# ROW1   FastFwd (11)  -             Back (13)    Up (14)      Left (15)
# ROW2   Blue (21)     Chan- (22)    Red (23)     Yellow (24)  Green (25)
# ROW3   Info (31)     Right (32)    Vol+ (33)    OK (34)      Down (35)
# ROW4   SRC (41)      Chan+ (42)    Vol- (43)    Mute (44)    Record (45)
#
# Power is not part of the matrix: it is an individual input on ROW5 (102).

binary_sensor:
  - platform: tca8418
    keypad_id: keypad
    key_code: 102
    name: "Power"
    on_press:
      # Power cycles between the last activity and Off.
      - lambda: |-
          bool is_off = id(activity).current_option() == "Off";
          id(activity).make_call().set_option(is_off ? "Watch TV" : "Off").perform();

  - platform: tca8418
    keypad_id: keypad
    key_code: 33
    name: "Volume Up"
    on_press:
      - script.execute:
          id: send_command
          function: volume_up

  - platform: tca8418
    keypad_id: keypad
    key_code: 43
    name: "Volume Down"
    on_press:
      - script.execute:
          id: send_command
