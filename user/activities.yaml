# Activities: what the remote is being used for right now.
#
# The activity decides which screen is shown and what the physical buttons do
# (see keymap.yaml). This file is yours to edit - add an activity by adding an
# option below, a page for it, and a branch in the page router.

# The activity is restored on boot, which happens before the screen is ready, so
# applying it is deferred until the display exists. Without that, the restored
# value redraws the screen too early and the top layer is left blank.
globals:
  - id: last_role
    type: std::string
    restore_value: false
  - id: ui_ready
    type: bool
    restore_value: false
    initial_value: "false"

esphome:
  on_boot:
    # Late, so LVGL has been set up.
    - priority: -100
      then:
        - lambda: "id(ui_ready) = true;"
        - script.execute: apply_activity

script:
  # Send a command to whichever device should receive it.
  #
  # A button says what it does - "volume_up" - not which device it is for. Each
  # command belongs to a role, and each activity decides which device fills each
  # role. So volume can go to an amplifier while watching television, and to the
  # speaker itself while streaming music, without the button knowing either.
  #
  # The command goes to Home Assistant, which decides how to deliver it - as
  # infrared through this remote, or over the network. Adding a device is a
  # change there, not a rebuild here.
  - id: send_command
    parameters:
      function: string
    then:
      # Work out the role first; the device depends on it.
      - script.execute:
          id: command_role
          function: !lambda "return function;"
      - homeassistant.event:
          event: esphome.omote_command
          data:
            command: !lambda "return function;"
            activity: !lambda "return id(activity).current_option().str();"
            role: !lambda "return id(last_role);"
            device: !lambda |-
              const std::string role = id(last_role);
              auto current = id(activity).current_option();

              // Which device fills each role, per activity. This is the part to
              // edit when adding an activity or moving a role to another device.
              if (current == "Watch TV") {
                // The amplifier is in the way of the sound, so it owns volume.
                if (role == "volume")
                  return std::string("amplifier");
                return std::string("television");
              }
              if (current == "Listen to Music") {
                // The speaker handles its own volume, so everything goes to it.
                return std::string("sonos");
              }
              return std::string("");
      - logger.log:
          format: "Command %s (%s)"
          args: ["function.c_str()", "id(last_role).c_str()"]

  # Work out which role a command belongs to. Roles are fixed - volume is always
  # volume - while which device serves a role is up to the activity.
  - id: command_role
    parameters:
      function: string
    then:
      - lambda: |-
          if (function == "volume_up" || function == "volume_down" || function == "mute") {
            id(last_role) = "volume";
          } else if (function == "channel_up" || function == "channel_down") {
            id(last_role) = "channel";
          } else if (function == "play" || function == "stop" || function == "rewind" ||
                     function == "fast_forward" || function == "record") {
            id(last_role) = "transport";
          } else {
            id(last_role) = "navigation";
          }

  # Bring the screen in line with the current activity.
  - id: apply_activity
    then:
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - if:
                condition:
                  lambda: 'return id(activity).current_option() == "Watch TV";'
                then:
                  - lvgl.page.show: page_tv
            - if:
                condition:
                  lambda: 'return id(activity).current_option() == "Listen to Music";'
                then:
                  - lvgl.page.show: page_music
            - if:
                condition:
                  lambda: |-
                    auto current = id(activity).current_option();
                    return current != "Watch TV" && current != "Listen to Music";
                then:
                  - lvgl.page.show: page_home
            - lvgl.label.update:
                id: status_activity
                text: !lambda "return id(activity).current_option().str();"
            # Showing a page can leave the top layer blank, so redraw it.
            - lvgl.widget.redraw:

select:
  - platform: template
    id: activity
    name: "Activity"
    icon: mdi:remote-tv
    optimistic: true
    restore_value: true
    options:
      - "Off"
      - "Watch TV"
      - "Listen to Music"
    on_value:
      - logger.log:
          format: "Activity: %s"
          args: ["x.c_str()"]
      - script.execute: apply_activity
      # Let Home Assistant react to the change too.
      - homeassistant.event:
          event: esphome.omote_activity_changed
          data:
            activity: !lambda "return x;"

lvgl:
  pages:
    # Home: pick an activity.
    - id: page_home
      widgets:
        - label:
            align: TOP_MID
            y: 8
            text: "OMOTE"
        - buttonmatrix:
            align: CENTER
            width: 220
            height: 200
            rows:
              - buttons:
                  - text: "Watch TV"
                    key_code: 1
              - buttons:
                  - text: "Listen to Music"
                    key_code: 2
              - buttons:
                  - text: "Off"
                    key_code: 3
            on_press:
              then:
                - lambda: |-
                    if (x == 0) id(activity).make_call().set_option("Watch TV").perform();
                    else if (x == 1) id(activity).make_call().set_option("Listen to Music").perform();
                    else id(activity).make_call().set_option("Off").perform();

    # One page per activity. The buttons call Home Assistant, so what they do can
    # be changed without rebuilding the firmware.
    - id: page_tv
      widgets:
        - label:
            align: TOP_MID
            y: 8
            text: "Watch TV"
        - buttonmatrix:
            align: CENTER
            width: 220
            height: 200
            rows:
              - buttons:
                  - text: "Vol +"
                  - text: "Ch +"
              - buttons:
                  - text: "Vol -"
                  - text: "Ch -"
              - buttons:
                  - text: "Home"
            on_press:
              then:
                - lambda: |-
                    static const char *const CMDS[] = {"volume_up", "channel_up", "volume_down", "channel_down"};
                    if (x < 4) {
                      ESP_LOGD("omote", "TV command: %s", CMDS[x]);
                    } else {
                      id(activity).make_call().set_option("Off").perform();
                    }

    - id: page_music
      widgets:
        - label:
            align: TOP_MID
            y: 8
            text: "Listen to Music"
        - buttonmatrix:
            align: CENTER
            width: 220
            height: 200
            rows:
              - buttons:
                  - text: "Play"
                  - text: "Pause"
              - buttons:
                  - text: "Prev"
                  - text: "Next"
              - buttons:
                  - text: "Home"
            on_press:
              then:
                - lambda: |-
                    if (x == 4) id(activity).make_call().set_option("Off").perform();
