esphome:
  name: omote-keypad-test
  on_boot:
    # OMOTE rev5: GPIO38 (active-low) powers the peripheral rail that the I2C
    # devices and their pull-ups sit on. Enable it before the bus initializes.
    - priority: 1010
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);
            delay(250);

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO20
  scl: GPIO19
  # OMOTE provides hardware pull-ups
  sda_pullup_enabled: false
  scl_pullup_enabled: false
  scan: true

tca8418:
  - id: keypad
    address: 0x34
    # The OMOTE scans a 5x5 key matrix on ROW0-4 / COL0-4. The pins left over
    # (ROW5-7, COL5-9) stay as individual inputs, which is how the Power button
    # is wired - it reports as key number 102 (ROW5).
    # interrupt_pin is deliberately omitted so the device is polled over I2C.
    # interrupt_pin: GPIO08
    rows: 5
    columns: 5
    on_key:
      - logger.log:
          format: "TCA8418 key number: %u"
          args: [x]

binary_sensor:
  # Power is an individual input on ROW5, so it is matched by key number.
  - platform: tca8418
    keypad_id: keypad
    key_code: 102
    name: "Power"
  # Matrix keys are matched by their position. Press every other button and read
  # its number from the log line above to fill in the rest: matrix numbers are
  # row * 10 + col + 1, so 2 is row 0 / col 1.
  - platform: tca8418
    keypad_id: keypad
    row: 0
    col: 4
    name: "Stop"
  - platform: tca8418
    keypad_id: keypad
    row: 0
    col: 3
    name: "Rewind"
  - platform: tca8418
    keypad_id: keypad
    row: 0
    col: 1
    name: "Play"
  - platform: tca8418
    keypad_id: keypad
    row: 1
    col: 0
    name: "Fast Forward"
