# Infrared engine.
#
# The remote presents itself to Home Assistant as an infrared adapter, using the
# `infrared` entities that the Home Assistant Infrared integration (2026.4 and
# later) drives. Home Assistant does the learning and keeps the codes, and the
# remote is the thing that sends and receives them - so devices can be added
# without rebuilding the firmware.
#
# Note: the infrared component is marked experimental in ESPHome, so its
# configuration may change between releases.

infrared:
  # Sends codes that Home Assistant passes down.
  - platform: ir_rf_proxy
    name: "IR Transmitter"
    remote_transmitter_id: ir_transmitter
  # Receives codes, which is what Home Assistant uses to learn a remote.
  # The receiver needs power for this: turn on the "IR Receiver Power" switch
  # (defined in core/hardware.yaml) while learning, and off afterwards to save
  # battery.
  - platform: ir_rf_proxy
    name: "IR Receiver"
    remote_receiver_id: ir_receiver
    receiver_frequency: 38kHz

# Convenience actions, for sending a known code from a script or automation
# without going through the Infrared integration. Codes that need to be fast, or
# to keep working when the network is down, are better mapped straight to a
# button in user/keymap.yaml so they are sent from the device.
api:
  actions:
    - action: send_pronto
      variables:
        code: string
      then:
        - remote_transmitter.transmit_pronto:
            data: !lambda "return code;"

    - action: send_nec
      variables:
        address: int
        command: int
      then:
        - remote_transmitter.transmit_nec:
            address: !lambda "return address;"
            command: !lambda "return command;"
