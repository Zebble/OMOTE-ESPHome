# Screen shell.
#
# Owns the display, the touchscreen and the bar that stays on top of every page.
# The pages themselves are yours, in user/activities.yaml.

lvgl:
  id: omote_lvgl
  displays:
    - omote_display
  touchscreens:
    - omote_touch
  # Drawn above every page, so the status stays visible whatever is on screen.
  top_layer:
    widgets:
      - label:
          id: status_activity
          align: TOP_LEFT
          x: 4
          y: 2
          text: "Starting"
      - label:
          id: status_battery
          align: TOP_RIGHT
          x: -4
          y: 2
          text: ""
      # The last button pressed. Handy when testing: press a button and read it
      # here, instead of watching the log.
      - label:
          id: status_key
          align: BOTTOM_MID
          y: -2
          text: ""

# Diagnostic: report what the screen is doing during start-up, so a cold boot can
# be compared with the boot straight after flashing.
esphome:
  on_boot:
    - priority: -100
      then:
        - logger.log: "UI: boot handler reached (LVGL should be up)"
    - priority: -200
      then:
        - delay: 3s
        - logger.log: "UI: redrawing after start-up"
        - lvgl.widget.redraw:
        - lvgl.label.update:
            id: status_key
            text: "ready"

interval:
  - interval: 5s
    then:
      - lvgl.widget.redraw:
